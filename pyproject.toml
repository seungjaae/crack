[project]
name = "crack"
version = "0.1.0"
description = "Concrete-to-Code Bridge Engine: extract colour-marked cracks from drone orthomosaics into CAD data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "rasterio>=1.3",
    "ezdxf>=1.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]

[project.scripts]
crack = "crack.cli:main"
crack-gui = "crack.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
