# =============================================================================
# Concrete-to-Code Bridge Engine  -  기본 설정
# 실제 드론 데이터로 튜닝하는 값들. 코드 수정 없이 여기만 바꾸면 됨.
# =============================================================================

[project]
# GeoTIFF에 CRS가 없을 때만 사용할 대체 GSD (mm/pixel).
# CRS가 있으면 이 값은 무시되고 GeoTIFF의 실제 해상도를 씀.
fallback_gsd_mm = 0.5


# -----------------------------------------------------------------------------
# 1) 색상 정의 - OpenCV HSV 기준 (H: 0~179, S: 0~255, V: 0~255)
#    hsv_ranges = [[h_min, s_min, v_min, h_max, s_max, v_max], ...]
#    빨강은 H=0 을 감싸고 돌기 때문에 구간이 2개다.
# -----------------------------------------------------------------------------
[colors.red]
hsv_ranges = [
    [  0,  80,  60,  10, 255, 255],
    [168,  80,  60, 179, 255, 255],
]

[colors.yellow]
hsv_ranges = [
    [ 20,  80,  80,  35, 255, 255],
]

[colors.cyan]
hsv_ranges = [
    [ 85,  70,  60, 105, 255, 255],
]


# -----------------------------------------------------------------------------
# 2) 균열 폭 등급 <-> 락카 색상 매핑
#    현장 색상 규칙이 바뀌면 여기 color 값만 바꾸면 된다.
#
#    W1: 0.1mm 이상 ~ 0.2mm 이하
#    W2: 0.2mm 초과 ~ 0.3mm 이하
#    W3: 0.3mm 초과
#    (0.1mm 미만은 균열로 보지 않으므로 현장에서 칠하지 않음 -> 처리 대상 아님)
# -----------------------------------------------------------------------------
[[grades]]
id         = "W1"
color      = "red"
label      = "0.1mm이상 0.2mm이하"
min_mm     = 0.1
max_mm     = 0.2
layer      = "CRACK_W1_0.1-0.2"
dxf_color  = 1      # AutoCAD Color Index: 1=red

[[grades]]
id         = "W2"
color      = "yellow"
label      = "0.2mm초과 0.3mm이하"
min_mm     = 0.2
max_mm     = 0.3
layer      = "CRACK_W2_0.2-0.3"
dxf_color  = 2      # 2=yellow

[[grades]]
id         = "W3"
color      = "cyan"
label      = "0.3mm초과"
min_mm     = 0.3
max_mm     = 0.0    # 0 = 상한 없음
layer      = "CRACK_W3_0.3-"
dxf_color  = 4      # 4=cyan


# -----------------------------------------------------------------------------
# 3) 노이즈 제거 - 그림자/타이어자국/흙/낙엽 걸러내기
# -----------------------------------------------------------------------------
[denoise]
morph_open_px    = 3     # 점 노이즈 제거 (열림 연산 커널)
morph_close_px   = 5     # 끊긴 선 잇기 (닫힘 연산 커널)
min_blob_area_px = 200   # 이보다 작은 덩어리는 버림
min_length_mm    = 30.0  # 이보다 짧은 세그먼트는 버림
min_elongation   = 3.0   # 길이/폭 비. 낙엽·얼룩처럼 뭉툭한 건 탈락
max_paint_width_mm = 60.0  # 칠 폭이 이보다 두꺼우면 선이 아니라 면 -> 탈락


# -----------------------------------------------------------------------------
# 4) 벡터화
# -----------------------------------------------------------------------------
[vectorize]
rdp_epsilon_px   = 1.5   # 폴리라인 단순화 허용오차. 클수록 점이 적어지고 계단현상이 준다
prune_spur_px    = 10    # 세선화 후 생기는 짧은 잔가지(spur) 제거 길이


# -----------------------------------------------------------------------------
# 5) 출력
# -----------------------------------------------------------------------------
[export]
dxf_version      = "R2010"   # AutoCAD 2010 이상 호환
write_text       = true      # 도면에 길이 텍스트 병기
text_height_mm   = 50.0      # 도면 상 텍스트 높이 (실척 mm)
text_layer_suffix = "_TEXT"
tsv_delimiter    = "\t"
